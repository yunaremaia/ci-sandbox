[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ci-sandbox"
version = "0.1.0"
description = "Local CI pipeline simulator — see what runs and what skips without executing anything."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Yunare Maia", email = "yunare@gmail.com" },
]
keywords = ["ci", "cd", "github-actions", "simulator", "devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
ci-sandbox = "ci_sandbox.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["ci_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
